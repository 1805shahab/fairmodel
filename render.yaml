# Free, ephemeral judging demo. Read docs/RENDER_DEPLOYMENT.md before deploying.
services:
  - type: web
    name: fairmodel
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    numInstances: 1
    envVars:
      - key: DEMO_ACCESS_USER
        value: fairmodel
      - key: DEMO_ACCESS_PASSWORD
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: paypal_sandbox
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_ALLOW_DRAFTS
        value: "false"
      - key: PAYPAL_ALLOW_SENDING
        value: "false"
      - key: ENABLE_VOICE_GENERATION
        value: "false"
      - key: ENABLE_FISH_GENERATION
        value: "false"
# Add provider keys in Render's Environment screen AFTER creating the service.
# Do not put credentials into this file or upload backend/.env as a secret file.
